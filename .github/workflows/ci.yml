name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows/amd64, runner: windows-2025}
          - {target: windows/arm64, runner: windows-11-arm}
          - {target: linux/amd64, runner: ubuntu-24.04}
          - {target: linux/arm64, runner: ubuntu-24.04-arm}
          - {target: darwin/amd64, runner: macos-15-intel}
          - {target: darwin/arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet and native tests
        shell: bash
        run: |
          test "$(go env GOOS)/$(go env GOARCH)" = "${{ matrix.target }}"
          go vet ./...
          go test -count=1 -timeout 10m ./...
      - name: Native release-mode build and version smoke
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p build/ci
          go build -trimpath -ldflags "-s -w -X main.version=0.1.0-ci" -o build/ci/ ./cmd/pail ./cmd/pail-desktop
          exe="$(go env GOEXE)"
          test "$("build/ci/pail$exe" version)" = "pail 0.1.0-ci"
          test "$("build/ci/pail-desktop$exe" --version)" = "Pail 0.1.0-ci"

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.12
          install_args: node
      - name: Formatting, workflow and release checks
        run: |
          test -z "$(git ls-files '*.go' ':(exclude).agents/**' | xargs gofmt -l)"
          node --test scripts/*.test.mjs
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          sh scripts/test-publish-site.sh
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout 15m ./...
        env:
          CGO_ENABLED: "1"

  minio:
    name: MinIO
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: integration
          file: integration/Dockerfile.minio
          load: true
          tags: pail-test-minio:ci
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max
      - run: bash scripts/integration-minio.sh
        env:
          PAIL_IT_MINIO_IMAGE: local:pail-test-minio:ci
