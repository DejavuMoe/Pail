name: CodeQL

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 3'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: go, platform: linux, runner: ubuntu-24.04}
          - {language: go, platform: windows, runner: windows-2025}
          - {language: go, platform: darwin, runner: macos-15}
          - {language: javascript-typescript, platform: linux, runner: ubuntu-24.04}
          - {language: actions, platform: linux, runner: ubuntu-24.04}
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          config-file: .github/codeql.yml
      - if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        env:
          GOFLAGS: -mod=readonly
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        env:
          GOFLAGS: -mod=readonly
        with:
          category: /language:${{ matrix.language }}/os:${{ matrix.platform }}
