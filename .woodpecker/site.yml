# Website deployment only; application validation and releases use GitHub Actions.
labels:
  platform: linux/amd64
  backend: docker
  role: netcup-vps500
  server: netcup-vps500

when:
  - event: [push, manual]
    branch: master

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.12.1@sha256:b8d2401997be68ec25d62bd753fe5d30236e029fe007a5e823177e0e485ae205

steps:
  - name: build-site
    image: golang:1.27.4-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    volumes:
      - /var/cache/woodpecker/pail/go-mod:/go/pkg/mod
      - /var/cache/woodpecker/pail/go-build:/root/.cache/go-build
    commands:
      - apt-get update && apt-get install -y --no-install-recommends jq
      - sh scripts/build-site.sh

  - name: publish-site
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    volumes:
      - /var/www/pail.download:/deploy
    commands:
      - apk add --no-cache coreutils util-linux
      - sh scripts/publish-site.sh public "$CI_COMMIT_SHA-$CI_PIPELINE_NUMBER-${CI_PIPELINE_RERUNS:-0}"

  - name: notify-search-engines
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    failure: ignore
    commands:
      - sh scripts/indexnow-site.sh public

concurrency:
  limit: 1
  group: pail-site-production
